					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

 <div id="res">${resultados(lista())}</div></div>`}

function qtd(rid,iid,d){const c=S.cart[rid]=S.cart[rid]||{};c[iid]=Math.max(0,(c[iid]||0)+d);if(!c[iid])delete c[iid];render()}
function fav(rid){const u=me();if(!u||u.role!='cli'){S.lt='cli';S.err='';toast('Entre como cliente para favoritar.');return nav('entrar')}u.favs=u.favs||[];const i=u.favs.indexOf(rid);i<0?u.favs.push(rid):u.favs.splice(i,1);save();render()}
function logPedido(rid){const r=R(rid),c=S.cart[rid]||{},it=r.menu.filter(i=>c[i.id]);DB.orders.push({id:uid(),rid,cli:DB.session,itens:it.map(i=>c[i.id]+'x '+i.nome),total:it.reduce((s,i)=>s+i.preco*c[i.id],0),t:Date.now()});save();setTimeout(()=>{S.cart[rid]={};render()},400)}
function menuHtml(r,c){const itens=r.menu.filter(i=>faixa(i.preco,S.imin,S.imax)),cats=[...new Set(itens.map(i=>i.cat))];return cats.length?cats.map(k=>`<h3 style="margin-top:1.2rem">${esc(k)}</h3>`+itens.filter(i=>i.cat==k).map(i=>`<div class="item ${i.disp?'':'off'}"><div class="em" style="background:${bg(i.foto,'')}">${i.foto?'':i.e||'🍽️'}</div><div class="gr"><b>${esc(i.nome)}</b><div class="meta">${esc(i.desc)}</div><b>${brl(i.preco)}</b></div>${i.disp?`<div class="q"><button aria-label="Remover um" onclick="qtd('${r.id}','${i.id}',-1)">−</button><span>${c[i.id]||0}</span><button aria-label="Adicionar um" onclick="qtd('${r.id}','${i.id}',1)">+</button></div>`:'<span class="tag e">Esgotado</span>'}</div>`).join('')).join(''):(r.menu.length?'<div class="emp"><h3>Nenhum item nessa faixa de preço</h3><p class="meta">Ajuste os valores mínimo e máximo.</p></div>':'<div class="emp"><h3>Cardápio em preparação</h3><p class="meta">Este restaurante ainda não publicou itens.</p></div>')}
function rest(){const r=R(S.v),u=me(),dono=u&&(u.role=='admin'||u.id==r.owner);
 if(!pub(r)&&!dono)return pubTop()+`<div class="wrap"><div class="emp" style="margin-top:2rem"><div class="big">⏸️</div><h2>Restaurante indisponível no momento</h2><p class="meta">Este perfil não está ativo. Veja outras opções perto de você.</p><button class="btn" onclick="nav('busca')">Buscar restaurantes</button></div></div>`;
 const c=S.cart[r.id]||{},it=r.menu.filter(i=>c[i.id]),tot=it.reduce((s,i)=>s+i.preco*c[i.id],0),f=u&&u.favs&&u.favs.includes(r.id);
 let msg='Olá, '+r.nome+'! Vim pelo Minefood.';if(it.length)msg+='\nMeu pedido:\n'+it.map(i=>c[i.id]+'x '+i.nome).join('\n')+'\nTotal: '+brl(tot);
 const wa='https://wa.me/55'+r.tel.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);
 return pubTop()+`<div class="rh" style="background:${bg(r.foto,r.k)}">${r.foto?'':r.e}</div><div class="wrap"><button class="btn t" style="margin:1rem 0" onclick="history.length>1?history.back():nav('busca')">‹ Voltar</button>
 ${!pub(r)?`<div class="banner w">Pré-visualização: este perfil está ${r.status!='publicado'?'suspenso':'com mensalidade vencida'} e não aparece para clientes.</div>`:''}
 <div style="display:flex;gap:1rem;align-items:start;justify-content:space-between"><h1 style="font-size:2.2rem">${esc(r.nome)}</h1><button class="btn o" aria-pressed="${!!f}" onclick="fav('${r.id}')">${f?'♥ Favorito':'♡ Favoritar'}</button></div>
 <p class="meta">${esc(r.cat)} · ${'$'.repeat(r.preco)} · <span class="tag ${r.aberto?'':'w'}">${r.aberto?'Aberto agora':'Fechado'}</span></p><p>${esc(r.desc)}</p>
 <div class="info"><div>📍 ${esc(r.end)}</div><div>📞 ${esc(r.tel)}</div>${r.insta?`<div>📷 ${esc(r.insta)}</div>`:''}<div>🕒 ${esc(r.hor)}</div></div>
 <h2>Cardápio</h2><div style="margin-bottom:.6rem">${precoBar('imin','imax',`menuF('${r.id}')`)}</div><div id="mn">${menuHtml(r,c)}</div>
 <div class="fab" style="position:sticky;bottom:10px;padding:.8rem 0"><div class="cart"><span>${it.length?`${it.reduce((s,i)=>s+c[i.id],0)} item(ns) · <b>${brl(tot)}</b>`:'Monte seu pedido ou fale direto com o restaurante'}</span><a class="btn wa" href="${wa}" target="_blank" rel="noopener" onclick="logPedido('${r.id}')">💬 Pedir pelo WhatsApp</a></div></div></div>`}

/* Entrar / criar conta */
async function enviarLogin(){const t=S.lt,e=$('#lg-e').value,p=$('#lg-p').value,n=S.reg&&$('#lg-n')?$('#lg-n').value.trim():'';S.f={e,n};
 if(!e.trim()||!p||(S.reg&&!n)){S.err='vazio';return render()}
 if(S.reg){if(p.length<6){S.err='curta';return render()}
  const x=await registrarCliente(n,e.trim(),p);if(x){S.err=x;return render()}}
 const u=await entrarConta(e,p,t);if(!u){S.err='cred';return render()}
 S.err='';S.f={};S.reg=false;toast('Bem-vindo, '+u.nome+'!');nav({admin:'painel',rest:'loja',cli:'conta'}[u.role])}
function entrar(){const t=S.lt,er=S.err,reg=S.reg&&t=='cli',T={cli:'Cliente',rest:'Restaurante',admin:'Administrador'};
 return pubTop()+`<div class="wrap"><form class="login" onsubmit="enviarLogin();return false" novalidate>
 <div class="tabs" role="tablist" style="margin-top:0">${Object.keys(T).map(k=>`<button type="button" role="tab" class="${t==k?'on':''}" onclick="S.lt='${k}';S.err='';S.reg=false;render()">${T[k]}</button>`).join('')}</div>
 <h2>${reg?'Criar conta de cliente':'Entrar como '+T[t].toLowerCase()}</h2>
 ${er=='cred'?'<div class="banner e" role="alert">E-mail ou senha incorretos para esta área. Confira os dados e tente de novo.</div>':''}
 ${er=='erro'?'<div class="banner e" role="alert">Não foi possível concluir. Verifique a conexão e tente de novo.</div>':''}
 ${er=='existe'?'<div class="banner e" role="alert">Já existe uma conta com este e-mail. Entre ou use outro e-mail.</div>':''}
 ${reg?`<div class="fld"><label for="lg-n">Nome</label><input id="lg-n" value="${esc(S.f.n||'')}" class="${er=='vazio'&&!S.f.n?'bad':''}" autocomplete="name">${er=='vazio'&&!S.f.n?'<span class="err">Informe seu nome.</span>':''}</div>`:''}
 <div class="fld"><label for="lg-e">E-mail</label><input id="lg-e" type="email" value="${esc(S.f.e||'')}" class="${er=='vazio'&&!S.f.e?'bad':''}" autocomplete="email">${er=='vazio'&&!S.f.e?'<span class="err">Informe seu e-mail.</span>':''}</div>
 <div class="fld"><label for="lg-p">Senha</label><input id="lg-p" type="password" class="${er=='vazio'||er=='curta'?'bad':''}" autocomplete="${reg?'new-password':'current-password'}">${er=='vazio'?'<span class="err">Informe a senha.</span>':''}${er=='curta'?'<span class="err">Use pelo menos 6 caracteres.</span>':''}</div>
 <button class="btn" style="width:100%">${reg?'Criar conta':'Entrar'}</button>
 <p style="text-align:center">${t=='cli'?`<button type="button" class="btn o" style="border:0" onclick="S.reg=${!reg};S.err='';render()">${reg?'Já tenho conta':'Criar conta de cliente'}</button>`:''}<button type="button" class="btn o" style="border:0" onclick="esqueci()">Esqueci minha senha</button></p>
 ${t=='rest'?'<p class="demo">Contas de restaurante são criadas pelo administrador do Minefood.</p>':''}</form></div>`}

/* Área do cliente */
function conta(){const u=me(),fv=(u.favs||[]).map(R).filter(Boolean),pd=DB.orders.filter(o=>o.cli==u.id).sort((a,b)=>b.t-a.t);
 return pubTop()+`<div class="wrap" style="padding-top:1.5rem"><h1 style="font-size:2rem">Olá, ${esc(u.nome)}</h1><p class="meta">${esc(u.email)}</p>
 <div class="tabs"><button class="${S.ct=='fav'?'on':''}" onclick="S.ct='fav';render()">Favoritos (${fv.length})</button><button class="${S.ct=='ped'?'on':''}" onclick="S.ct='ped';render()">Pedidos iniciados (${pd.length})</button></div>
 ${S.ct=='fav'?(fv.length?`<div class="grid">${fv.map(card).join('')}</div>`:'<div class="emp"><div class="big">♡</div><h3>Nenhum favorito ainda</h3><p class="meta">Toque em “Favoritar” na página de um restaurante.</p><button class="btn" onclick="nav(\'busca\')">Buscar restaurantes</button></div>')
 :(pd.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Restaurante</th><th>Itens</th><th>Total</th></tr></thead><tbody>${pd.map(o=>`<tr><td>${new Date(o.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc((R(o.rid)||{nome:'Removido'}).nome)}</td><td>${o.itens.length?esc(o.itens.join(', ')):'Conversa iniciada'}</td><td>${o.total?brl(o.total):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="emp"><div class="big">🧾</div><h3>Nenhum pedido iniciado</h3><p class="meta">Quando você tocar em “Pedir pelo WhatsApp”, o registro aparece aqui.</p></div>')}</div>`}

</script>
<script>
/* Área do administrador e "Minha loja" do restaurante */
function shell(items,c,cls=''){const nv=items.map(([k,i,t])=>`<button class="nv ${S.v==k||(k=='restaurantes'&&S.v=='gestao')?'on':''}" onclick="${k=='sair'?'sair()':`nav('${k}')`}">${i} ${t}${k=='notificacoes'?bd(pendentes()):''}</button>`);
 return `<div class="adm ${cls}"><aside><button class="logo" onclick="nav('home')">Mine<b>food</b></button> <span class="badge">${cls?'Loja':'Admin'}</span><nav style="margin-top:1rem" aria-label="Menu">${nv.join('')}</nav></aside><main>${c}</main><nav class="bn" aria-label="Menu">${items.map(([k,i,t])=>`<button class="${S.v==k?'on':''}" onclick="${k=='sair'?'sair()':`nav('${k}')`}">${i}<br>${t}${k=='notificacoes'?bd(pendentes()):''}</button>`).join('')}</nav></div>`}
const AM=[['painel','📊','Painel'],['restaurantes','🍴','Lojas'],['pagamentos','💳','Pagamentos'],['notificacoes','🔔','Notificações'],['sair','🚪','Sair']];
const kp=(n,t)=>`<div><b>${n}</b>${t}</div>`;
function painel(){const a=DB.rests.filter(pub).length,pend=DB.rests.filter(r=>mst(r)!='Em dia'),tot=DB.rests.reduce((s,r)=>s+r.mens.valor,0);
 return shell(AM,`<h1 style="font-size:1.9rem">Painel</h1><div class="kp">${kp(a,'Restaurantes ativos')}${kp(brl(tot),'Mensalidades contratadas')}${kp(pend.length,'Pagamentos pendentes')}${kp(DB.orders.length,'Pedidos iniciados')}</div>
 <div class="acts" style="margin-bottom:1rem"><button class="btn" onclick="novaLoja()">+ Cadastrar restaurante</button><button class="btn o" onclick="nav('pagamentos')">Ver pagamentos</button></div>
 <h2>Atenção</h2>${pend.length?pend.map(r=>`<div class="banner w">${esc(r.nome)}: ${mst(r)=='Em análise'?'pagamento informado, aguardando confirmação.':mst(r)=='Vencida'?'mensalidade vencida em '+fmt(r.mens.venc)+'.':'vence em '+fmt(r.mens.venc)+'.'}</div>`).join(''):'<div class="emp"><h3>Tudo em dia</h3><p class="meta">Nenhuma mensalidade pendente.</p></div>'}`)}
function filtrar(){const q=$('#fq').value.toLowerCase(),s=$('#fs').value;document.querySelectorAll('#rt tbody tr').forEach(tr=>{tr.hidden=!(tr.dataset.n.includes(q)&&(!s||tr.dataset.s==s))})}
function restaurantes(){return shell(AM,`<h1 style="font-size:1.9rem">Restaurantes</h1><div class="bar"><div class="fld" style="margin:0;flex:1;min-width:180px"><input id="fq" aria-label="Buscar restaurante" placeholder="Buscar por nome" oninput="filtrar()"></div><select id="fs" aria-label="Status" onchange="filtrar()"><option value="">Todas as mensalidades</option><option>Em dia</option><option>Vence em breve</option><option>Em análise</option><option>Vencida</option></select><button class="btn" onclick="novaLoja()">+ Novo restaurante</button></div>
 ${DB.rests.length?`<div class="tw"><table id="rt"><thead><tr><th>Restaurante</th><th>Perfil</th><th>Mensalidade</th><th>Ações</th></tr></thead><tbody>${DB.rests.map(r=>`<tr data-n="${esc(r.nome.toLowerCase())}" data-s="${mst(r)}"><td><b>${r.e} ${esc(r.nome)}</b><div class="meta">${esc(r.cat)}</div></td><td><span class="tag ${r.status=='publicado'?'':'e'}">${r.status=='publicado'?'Publicado':'Suspenso'}</span></td><td>${stTag(mst(r))}</td><td><div class="acts"><button onclick="nav('${r.id}')">Ver</button><button onclick="S.edit='${r.id}';S.tab='perfil';nav('gestao')">Gerenciar</button><button onclick="mudarStatus('${r.id}')">${r.status=='publicado'?'Suspender':'Publicar'}</button><button onclick="removerLoja('${r.id}')">Remover</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="emp"><div class="big">🍴</div><h3>Nenhum restaurante cadastrado</h3><p class="meta">Cadastre o primeiro para ele aparecer na busca.</p><button class="btn" onclick="novaLoja()">Cadastrar restaurante</button></div>'}`)}
function mudarStatus(id){const r=R(id),s=r.status=='publicado';confirmar((s?'Suspender ':'Publicar ')+esc(r.nome)+'?',s?'O perfil sai do ar para os clientes.':'O perfil volta a aparecer para os clientes (se a mensalidade estiver em dia).',()=>{r.status=s?'suspenso':'publicado';save();render();toast(s?'Restaurante suspenso':'Restaurante publicado')},s?'Suspender':'Publicar',s?'d':'')}
function removerLoja(id){const r=R(id);confirmar('Remover '+esc(r.nome)+'?','O perfil, o cardápio e o acesso do restaurante serão apagados. Esta ação não pode ser desfeita.',()=>{DB.rests=DB.rests.filter(x=>x.id!=id);DB.notifs=(DB.notifs||[]).filter(n=>n.rid!=id&&n.para!=id);DB.users=DB.users.filter(u=>u.id!=r.owner);save();render();toast('Restaurante removido')},'Remover')}
function novaLoja(){modal(`<h2>Novo restaurante</h2><form onsubmit="criarLoja();return false" novalidate>
 <h3>Dados do restaurante</h3><div class="fld"><label for="n-n">Nome *</label><input id="n-n"></div><div class="fld"><label for="n-c">Categoria</label><select id="n-c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fld"><label for="n-ci">Cidade *</label><input id="n-ci"></div><div class="fld"><label for="n-t">WhatsApp (com DDD) *</label><input id="n-t" placeholder="(31) 99999-0000" inputmode="tel"></div><div class="fld"><label for="n-v">Mensalidade (R$)</label><input id="n-v" value="99" inputmode="decimal"></div>
 <h3>Acesso do responsável</h3><div class="fld"><label for="n-e">E-mail *</label><input id="n-e" type="email"></div><div class="fld"><label for="n-s">Senha provisória * (mín. 6)</label><input id="n-s" type="text"></div><p class="err" id="n-er" role="alert"></p>
 <div class="acts" style="justify-content:flex-end"><button type="button" class="btn t" onclick="fechar()">Cancelar</button><button class="btn">Cadastrar</button></div></form>`)}
async function criarLoja(){const g=i=>$('#n-'+i).value.trim(),er=m=>$('#n-er').textContent=m,n=g('n'),e=g('e').toLowerCase(),s=g('s'),t=g('t'),ci=g('ci'),v=parseFloat(g('v').replace(',','.'));
 if(!n||!e||!s||!t||!ci)return er('Preencha nome, cidade, WhatsApp, e-mail e senha.');if(!/^\S+@\S+\.\S+$/.test(e))return er('Informe um e-mail válido.');if(t.replace(/\D/g,'').length<10)return er('Informe o WhatsApp com DDD.');if(s.length<6)return er('A senha precisa ter pelo menos 6 caracteres.');if(!(v>0))return er('Informe o valor da mensalidade.');
 if(DB.users.some(u=>u.email==e))return er('Já existe uma conta com este e-mail.');
 const c=g('c'),id='r'+uid();let o;if(CLOUD){try{o=await criarAuthRest(e,s)}catch(x){return er(msgAuth(x))}}else o='u'+uid();
 DB.users.push(CLOUD?{id:o,role:'rest',nome:n,email:e}:{id:o,role:'rest',nome:n,email:e,h:await sha(s)});
 DB.rests.push({id,owner:o,nome:n,cat:c,e:'🍽️',k:'#f3eaee',preco:2,hor:'Defina o horário',desc:'Descreva seu restaurante.',end:'',cidade:ci,tel:t,insta:'',aberto:true,status:'publicado',foto:'',mens:{valor:v,venc:plus(30),analise:false},menu:[]});
 save();fechar();render();toast('Restaurante cadastrado. Envie o e-mail e a senha provisória ao responsável.')}
function pagamentos(){const px=pixCfg();return shell(AM,`<h1 style="font-size:1.9rem">Mensalidades e pagamentos</h1><div class="two"><div class="tw"><table style="min-width:0"><thead><tr><th>Restaurante</th><th>Valor</th><th>Vence</th><th>Status</th><th></th></tr></thead><tbody>${DB.rests.map(r=>`<tr><td>${esc(r.nome)}</td><td>${brl(r.mens.valor)}</td><td>${fmt(r.mens.venc)}</td><td>${stTag(mst(r))}</td><td><div class="acts">${mst(r)!='Em dia'?`<button class="btn t" onclick="confirmarPg('${r.id}')">Confirmar</button>`:''}${r.mens.analise?`<button onclick="recusarPg('${r.id}')">Não recebi</button>`:''}<button onclick="verQr('${r.id}')">QR Pix</button></div></td></tr>`).join('')}</tbody></table></div>
 <div class="tw" style="padding:1rem"><h3>Pix da plataforma</h3>${pixOk()?'':'<div class="banner w">Chave Pix ainda não cadastrada. Os restaurantes só veem o Pix de pagamento depois que você salvar uma chave válida.</div>'}
 <div class="fld"><label for="px">Chave Pix</label><input id="px" value="${esc(px.chave===PIX_PLACEHOLDER?'':px.chave)}" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória" oninput="const k=pixKey(this.value);$('#pxt').textContent=this.value.trim()?(k?'Tipo detectado: '+k.tipo:'Chave inválida'):''"><span class="demo" id="pxt">${pixKey(px.chave)&&px.chave!==PIX_PLACEHOLDER?'Tipo detectado: '+pixKey(px.chave).tipo:''}</span></div>
 <div class="fld"><label for="pxn">Nome do recebedor (máx. 25)</label><input id="pxn" maxlength="25" value="${esc(px.nome)}"></div>
 <div class="fld"><label for="pxc2">Cidade do recebedor (máx. 15)</label><input id="pxc2" maxlength="15" value="${esc(px.cidade)}"></div>
 <button class="btn" onclick="salvarPix()">Salvar chave</button><p class="demo">A chave salva aqui é a usada no QR Code e no “copia e cola” da mensalidade de cada restaurante. O Minefood não processa pagamentos: você confere o Pix recebido e confirma na lista ao lado.</p></div></div>`)}
function salvarPix(){const k=$('#px').value.trim(),n=$('#pxn').value.trim(),c=$('#pxc2').value.trim(),v=pixKey(k);
 if(!v)return toast('Chave Pix inválida. Use CPF, CNPJ, e-mail, telefone com DDD ou chave aleatória.');
 if(!pixTxt(n,25))return toast('Informe o nome do recebedor.');if(!pixTxt(c,15))return toast('Informe a cidade do recebedor.');
 DB.cfg.pix=k;DB.cfg.pixNome=n;DB.cfg.pixCidade=c;if(save()){render();toast('Chave Pix salva ('+v.tipo+')')}}

/* Loja: usada pelo restaurante (loja) e pelo administrador (gestao) */
const OM=[['loja','🏪','Minha loja'],['ver','👁️','Ver página'],['sair','🚪','Sair']];
function loja(){const u=me(),r=DB.rests.find(x=>x.owner==u.id),adm=S.v=='gestao';
 if(!r)return shell(OM,'<div class="emp"><h2>Loja não encontrada</h2></div>','rs');
 const m=mst(r),aviso=m=='Vencida'?`<div class="banner e" role="alert"><b>Perfil suspenso.</b> A mensalidade venceu em ${fmt(r.mens.venc)}. Seu perfil e cardápio não aparecem para os clientes até o pagamento ser confirmado.</div>`:m=='Vence em breve'?`<div class="banner w">A mensalidade vence em ${fmt(r.mens.venc)}.</div>`:m=='Em análise'?'<div class="banner w">Pagamento informado. Aguarde a confirmação do Minefood.</div>':'';
 return shell(OM,lojaCorpo(r,aviso,false),'rs')}
function gestao(){const r=R(S.edit);if(!r)return nav('restaurantes');return shell(AM,`<button class="btn t" onclick="nav('restaurantes')">‹ Restaurantes</button>`+lojaCorpo(r,'',true))}
function lojaCorpo(r,aviso,adm){const nl=adm?0:naoLidas(r.id);
 const corpo=S.tab=='perfil'?perfil(r):S.tab=='cardapio'?cardapio(r):S.tab=='notif'&&!adm?notifLoja(r):mens(r),n2=adm?0:naoLidas(r.id);
 const T=[['perfil','Perfil'],['cardapio','Cardápio'],['mens','Mensalidade']];if(!adm)T.push(['notif','🔔 Notificações'+(n2?` (${n2})`:'')]);
 const av=!adm&&nl&&S.tab!='notif'?`<div class="banner w" role="status">🔔 Você tem ${nl} notificação(ões) nova(s). <button class="btn t" style="margin-left:.5rem" onclick="S.tab='notif';render()">Ver</button></div>`:'';
 return `<h1 style="font-size:1.9rem;margin-top:.6rem">${esc(r.nome)}</h1>${aviso}${av}<div class="tabs" role="tablist">${T.map(([k,t])=>`<button role="tab" class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${t}</button>`).join('')}</div>${corpo}`}
function perfil(r){const o=(v,a)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');

/* ===== Pix real (BR Code / "Pix Copia e Cola") ===== */
const PIX_PLACEHOLDER='pix@minefood.exemplo';
function cpfOk(d){if(d.length!=11||/^(\d)\1+$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+d[i]*(t+1-i);if((s*10%11)%10!=+d[t])return false}return true}
function pixKey(s){s=String(s||'').trim();if(!s)return null;
 if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)&&s.length<=77)return{tipo:'E-mail',v:s.toLowerCase()};
 if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s))return{tipo:'Chave aleatória',v:s.toLowerCase()};
 if(!/^[+\d\s().\/-]+$/.test(s))return null;
 const d=s.replace(/\D/g,'');
 if(s[0]=='+')return d.length>=12&&d.length<=13&&d.startsWith('55')?{tipo:'Telefone',v:'+'+d}:null;
 if(d.length==14)return{tipo:'CNPJ',v:d};
 if(d.length==11&&/^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$/.test(s)&&cpfOk(d))return{tipo:'CPF',v:d};
 if((d.length==10||d.length==11)&&d[0]!='0')return{tipo:'Telefone',v:'+55'+d};
 if((d.length==12||d.length==13)&&d.startsWith('55'))return{tipo:'Telefone',v:'+'+d};
 return null}
function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const pixTxt=(s,n)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,n);
function pixPayload(chave,valor,nome,cidade,txid){const f=(i,v)=>i+String(v.length).padStart(2,'0')+v;
 const p=f('00','01')+f('01','11')+f('26',f('00','br.gov.bcb.pix')+f('01',chave))+f('52','0000')+f('53','986')+f('54',Number(valor).toFixed(2))+f('58','BR')+f('59',pixTxt(nome,25)||'MINEFOOD')+f('60',pixTxt(cidade,15)||'BRASIL')+f('62',f('05',String(txid).replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
 return p+crc16(p)}
const pixCfg=()=>({chave:DB.cfg.pix||'',nome:DB.cfg.pixNome||'Minefood',cidade:DB.cfg.pixCidade||'Belo Horizonte'});
const pixOk=()=>{const c=pixCfg();return c.chave.trim().toLowerCase()!=PIX_PLACEHOLDER&&!!pixKey(c.chave)};
function qrSvg(t){try{const q=window.MFQR(t),n=q.getModuleCount(),m=4;let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
 return`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" width="220" height="220" role="img" aria-label="QR Code Pix" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return''}}
function copiarPix(){const i=$('#pxc');if(!i)return;const ok=()=>toast('Código Pix copiado');i.select();i.setSelectionRange(0,99999);
 const fb=()=>{try{document.execCommand('copy')?ok():toast('Copie o código manualmente')}catch(e){toast('Copie o código manualmente')}};
 navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(i.value).then(ok,fb):fb()}

function confirmarPg(id){const r=R(id),b=days(r.mens.venc)>0?r.mens.venc:iso(new Date());confirmar('Confirmar pagamento?',esc(r.nome)+' ficará em dia por mais 30 dias e o perfil volta ao ar.',()=>{r.mens.venc=plus(30,b);r.mens.analise=false;(DB.notifs||[]).forEach(n=>{if(n.para=='admin'&&n.rid==id&&n.tipo=='informado'&&!n.res){n.res='confirmado';n.lida=true}});notif(id,'confirmado',id,{valor:r.mens.valor,venc:r.mens.venc});save();render();toast('Pagamento confirmado')},'Confirmar','')}

function notificacoes(){const pend=DB.rests.filter(r=>r.mens.analise),hist=(DB.notifs||[]).filter(n=>n.para=='admin'&&R(n.rid)),ult=id=>(hist.find(n=>n.rid==id&&n.tipo=='informado')||{}).t;

 const html=shell(AM,`<h1 style="font-size:1.9rem">Notificações</h1><h2>Aguardando confirmação (${pend.length})</h2>${pend.length?pend.map(r=>`<div class="tw" style="padding:1rem;margin-bottom:.8rem"><b>${esc(r.nome)}</b> informou o pagamento de <b>${brl(r.mens.valor)}</b><div class="meta">${ult(r.id)?hora(ult(r.id)):''}</div><p class="meta" style="margin:.4rem 0">Confira no app do seu banco se o Pix de ${brl(r.mens.valor)} chegou antes de confirmar.</p><div class="acts"><button class="btn" onclick="confirmarPg('${r.id}')">Confirmar recebimento</button><button class="btn o" onclick="recusarPg('${r.id}')">Não recebi</button><button onclick="verQr('${r.id}')">Ver QR Pix</button></div></div>`).join(''):'<div class="emp"><div class="big">🔔</div><h3>Nenhum pagamento aguardando</h3><p class="meta">Quando um restaurante informar um pagamento, ele aparece aqui.</p></div>'}
 <h2 style="margin-top:1.5rem">Histórico</h2>${hist.length?`<div class="tw"><table style="min-width:0"><thead><tr><th>Quando</th><th>Restaurante</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${hist.map(n=>`<tr><td>${hora(n.t)}</td><td>${esc(R(n.rid).nome)}</td><td>${brl(n.valor)}</td><td>${tg(n)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="meta">Sem registros ainda.</p>'}`);
 return html}
function notifLoja(r){const l=(DB.notifs||[]).filter(n=>n.para==r.id),msg=n=>n.tipo=='confirmado'?`✅ <b>Pagamento confirmado.</b> Seu Pix de ${brl(n.valor)} foi recebido. Mensalidade em dia até ${fmt(n.venc)}.`:n.tipo=='recusado'?`⚠️ <b>Pix não localizado.</b> Não encontramos o pagamento de ${brl(n.valor)}. Confira e informe novamente na aba Mensalidade.`:`🕒 <b>Pagamento informado</b> (${brl(n.valor)}). Aguardando a confirmação do Minefood. Protocolo ${esc(n.prot||'')}.`;
 const html=l.length?l.map(n=>`<div class="tw" style="padding:.9rem 1rem;margin-bottom:.6rem;${n.lida?'':'border-color:var(--pr)'}"><div>${msg(n)}</div><div class="meta">${hora(n.t)}${n.lida?'':' · <b>Nova</b>'}</div></div>`).join(''):'<div class="emp"><div class="big">🔔</div><h3>Nenhuma notificação</h3><p class="meta">Avisos sobre os seus pagamentos aparecem aqui.</p></div>';

<script>

let auth=null,fs=null,SEC=null,LOGIN_BUSY=false,AU=0,UNS=[],RT=null;
const RAW={rests:[],menu:[]},LAST={users:{},rests:{},menu:{},orders:{},notifs:{},cfg:{}};
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:a>b?1:0)):v);
const idx=a=>Object.fromEntries(a.map(x=>[x.id,sj(x)]));
const clean=d=>JSON.parse(JSON.stringify(d));

function rebuild(){DB.rests=RAW.rests.map(r=>({...r,menu:RAW.menu.filter(i=>i.rid==r.id).sort((a,b)=>(a.ord||0)-(b.ord||0))}));LAST.rests=idx(RAW.rests);LAST.menu=idx(RAW.menu)}
function cloudSave(){
 DB.rests.forEach(r=>{let mx=Math.max(0,...r.menu.map(i=>i.ord||0));r.menu.forEach(i=>{if(!i.ord)i.ord=++mx})});
 const C={users:()=>DB.users.map(u=>[u.id,u]),rests:()=>DB.rests.map(r=>{const{menu,...d}=r;return[r.id,d]}),menu:()=>DB.rests.flatMap(r=>r.menu.map(i=>[i.id,{...i,rid:r.id}])),orders:()=>DB.orders.map(o=>[o.id,o]),notifs:()=>DB.notifs.map(n=>[n.id,n]),cfg:()=>Object.keys(DB.cfg).length?[['main',DB.cfg]]:[]};
 const ops=[];
 for(const c in C){const cur=C[c](),ids=new Set(cur.map(x=>x[0])),last=LAST[c]=LAST[c]||{};
  for(const[id,d]of cur){const v=clean(d),j=sj(v);if(last[id]!==j){ops.push(['set',c,id,v]);last[id]=j}}
  for(const id in last)if(!ids.has(id)){ops.push(['del',c,id]);delete last[id]}}
 for(let i=0;i<ops.length;i+=400){const b=fs.batch();ops.slice(i,i+400).forEach(([t,c,id,v])=>{const ref=fs.collection(c).doc(id);t=='set'?b.set(ref,v):b.delete(ref)});
  b.commit().catch(e=>{console.error('save',e);toast('Não foi possível salvar. Verifique a conexão e as permissões.')})}
 return true}
function stopRole(){UNS.forEach(f=>f());UNS=[];DB.orders=[];LAST.orders={};DB.notifs=[];LAST.notifs={};DB.cfg={};LAST.cfg={}}
function startRole(u){const uid=u.id,add=f=>UNS.push(f),er=n=>e=>console.error(n,e);
 const col=(c,q)=>add(q.onSnapshot(s=>{DB[c]=s.docs.map(d=>d.data());LAST[c]=idx(DB[c]);schedRender(s.metadata.hasPendingWrites)},er(c)));
 const cfg=()=>add(fs.doc('cfg/main').onSnapshot(s=>{DB.cfg=s.exists?s.data():{};LAST.cfg={main:sj(DB.cfg)};schedRender(s.metadata.hasPendingWrites)},er('cfg')));
 const eu=()=>add(fs.doc('users/'+uid).onSnapshot(s=>{if(s.exists){DB.users=[s.data()];LAST.users={[uid]:sj(DB.users[0])};schedRender(s.metadata.hasPendingWrites)}},er('users')));
 if(u.role=='admin'){col('users',fs.collection('users'));col('orders',fs.collection('orders'));col('notifs',fs.collection('notifs'));cfg()}
 else if(u.role=='rest'){eu();col('notifs',fs.collection('notifs').where('owner','==',uid));cfg()}
 else{eu();col('orders',fs.collection('orders').where('cli','==',uid))}}
async function applyUser(fu){const my=++AU;stopRole();DB.session=null;DB.users=[];LAST.users={};if(!fu)return;
 const d=await fs.doc('users/'+fu.uid).get();if(my!=AU)return;
 if(!d.exists){await auth.signOut();return}
 const u=d.data();DB.users=[u];LAST.users={[u.id]:sj(u)};DB.session=u.id;startRole(u)}
function watchPub(c){return new Promise((res,rej)=>{let first=true;fs.collection(c).onSnapshot(s=>{RAW[c]=s.docs.map(d=>d.data());rebuild();if(first){first=false;res()}else schedRender(s.metadata.hasPendingWrites)},e=>{console.error(c,e);if(first){first=false;rej(e)}})})}
async function cloudBoot(){
 if(typeof firebase=='undefined')throw new Error('SDK do Firebase não carregou');
 firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();auth.languageCode='pt-BR';
 DB={session:null,cfg:{},orders:[],notifs:[],users:[],rests:[]};
 try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
 try{const s=await fs.doc('cfg/setup').get();NEEDS_SETUP=!s.exists}catch(e){NEEDS_SETUP=false}
 await Promise.all([watchPub('rests'),watchPub('menu')]);
 const u0=await new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u)})});
 await applyUser(u0);
 auth.onAuthStateChanged(async u=>{if(LOGIN_BUSY||!BOOTED)return;await applyUser(u);go(location.hash.slice(1))})}
async function cloudLogin(email,pw,role){LOGIN_BUSY=true;
 try{const c=await auth.signInWithEmailAndPassword(String(email).trim().toLowerCase(),pw),d=await fs.doc('users/'+c.user.uid).get();
  if(!d.exists||d.data().role!=role){await auth.signOut();await applyUser(null);return null}
  await applyUser(c.user);return me()}
 catch(x){if(x&&x.code=='auth/network-request-failed')toast('Sem conexão com a internet.');else if(x&&x.code=='auth/too-many-requests')toast('Muitas tentativas. Aguarde um pouco e tente de novo.');return null}
 finally{LOGIN_BUSY=false}}
function cloudLogout(){auth.signOut().then(()=>{S.cart={};nav('home')})}
async function registrarCliente(n,e,p){
 if(!CLOUD){if(DB.users.some(u=>u.email==e.toLowerCase()))return'existe';DB.users.push({id:'u'+uid(),role:'cli',nome:n,email:e.toLowerCase(),h:await sha(p),favs:[]});save();return''}
 LOGIN_BUSY=true;
 try{const c=await auth.createUserWithEmailAndPassword(e.toLowerCase(),p),id=c.user.uid;await fs.doc('users/'+id).set({id,role:'cli',nome:n,email:e.toLowerCase(),favs:[]});return''}
 catch(x){const k=x&&x.code;return k=='auth/email-already-in-use'?'existe':k=='auth/weak-password'?'curta':'erro'}
 finally{LOGIN_BUSY=false}}
async function criarAuthRest(e,s){SEC=SEC||firebase.initializeApp(FIREBASE_CONFIG,'sec');const a=SEC.auth(),c=await a.createUserWithEmailAndPassword(e,s),id=c.user.uid;await a.signOut();return id}
const msgAuth=x=>{const k=x&&x.code;return k=='auth/email-already-in-use'?'Já existe uma conta com este e-mail.':k=='auth/invalid-email'?'Informe um e-mail válido.':k=='auth/weak-password'?'A senha precisa ter pelo menos 6 caracteres.':k=='auth/network-request-failed'?'Sem conexão com a internet.':'Não foi possível criar o acesso do restaurante.'};
function esqueci(){if(!CLOUD)return toast('A recuperação por e-mail exige o banco de dados online. Peça ao administrador para redefinir.');
 const e=($('#lg-e').value||'').trim();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Digite seu e-mail no campo acima e toque de novo.');
 auth.sendPasswordResetEmail(e).then(()=>toast('Se o e-mail estiver cadastrado, enviamos o link para criar uma nova senha.'),()=>toast('Não foi possível enviar agora. Tente de novo em instantes.'))}
function setupView(){return `<div class="wrap"><form class="login" onsubmit="enviarSetup();return false" novalidate><h2>Primeiro acesso</h2><p class="meta">Crie a conta do administrador do Minefood. Esta tela só aparece uma vez.</p><div class="fld"><label for="st-n">Nome</label><input id="st-n" value="Administrador"></div><div class="fld"><label for="st-e">E-mail</label><input id="st-e" type="email" autocomplete="email"></div><div class="fld"><label for="st-p">Senha (mín. 6)</label><input id="st-p" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%">Criar administrador</button></form></div>`}
async function enviarSetup(){const n=$('#st-n').value.trim()||'Administrador',e=$('#st-e').value.trim().toLowerCase(),p=$('#st-p').value;
 if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6)return toast('Informe um e-mail válido e uma senha de pelo menos 6 caracteres.');
 LOGIN_BUSY=true;
 try{const c=await auth.createUserWithEmailAndPassword(e,p),id=c.user.uid,b=fs.batch();
  b.set(fs.doc('users/'+id),{id,role:'admin',nome:n,email:e});b.set(fs.doc('cfg/setup'),{done:true});b.set(fs.doc('cfg/main'),{pix:PIX_CHAVE,pixNome:'Minefood',pixCidade:'Belo Horizonte'});
  await b.commit();NEEDS_SETUP=false;await applyUser(c.user);toast('Administrador criado!');nav('painel')}
 catch(x){console.error(x);toast(x&&x.code=='auth/email-already-in-use'?'Este e-mail já tem conta. Use outro ou apague-o no console do Firebase.':'Não foi possível concluir o primeiro acesso. Confira as regras do Firestore.')}
 finally{LOGIN_BUSY=false}}
</script>
<script>
/* Navegação (rotas por #), proteção das áreas e início do app */
const nav=t=>{if(location.hash.slice(1)==t)go(t);else location.hash=t};
const ROLE={notificacoes:'admin',painel:'admin',restaurantes:'admin',pagamentos:'admin',gestao:'admin',loja:'rest',conta:'cli'};
function go(t){t=t||'home';if(NEEDS_SETUP)t='setup';
 if(t=='ver'){const u=me(),r=u&&DB.rests.find(x=>x.owner==u.id);return r?nav(r.id):nav('loja')}
 if(t=='gestao'&&!R(S.edit))t='restaurantes';
 const need=ROLE[t],u=me();
 if(need&&(!u||u.role!=need)){S.lt=need;S.err='';S.v='entrar';toast('Entre na área '+({admin:'do administrador',rest:'do restaurante',cli:'do cliente'}[need])+' para continuar.');history.replaceState(null,'','#entrar');return render()}
 if(t=='entrar'&&u)return nav({admin:'painel',rest:'loja',cli:'conta'}[u.role]);
 const nv=DB.rests.some(r=>r.id==t)||VIEWS[t]?t:'home';if(nv!=S.v){S.imin='';S.imax=''}S.v=nv;fechar();render();scrollTo(0,0)}
const VIEWS={setup:setupView,home,busca,entrar,conta,notificacoes,painel,restaurantes,pagamentos,loja,gestao};
function render(){const v=S.v,f=VIEWS[v]||(DB.rests.some(r=>r.id==v)?rest:home);$('#app').innerHTML=f()||'';
 const t={home:'Minefood',busca:'Buscar · Minefood',entrar:'Entrar · Minefood'}[v];document.title=t||'Minefood'}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
$('#app').innerHTML='<div class="wrap"><p class="meta" style="padding:3rem 0;text-align:center">Carregando…</p></div>';
(CLOUD?cloudBoot():seed()).then(()=>{BOOTED=true;go(location.hash.slice(1))},e=>{console.error(e);$('#app').innerHTML='<div class="wrap"><div class="emp" style="margin-top:2rem"><div class="big">⚠️</div><h2>Não foi possível conectar</h2><p class="meta">Verifique sua conexão e a configuração do Firebase.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div></div>'});

</script>
